<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BiSub settings</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--accent:#0a66ff;--warn:#b25000;--chip:#f2f2f7}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f5f5f7;--muted:#a1a1a6;--line:#3a3a3c;--accent:#4c8dff;--warn:#ff9f0a;--chip:#2c2c2e}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:18px;margin:0 0 16px}
h2{font-size:14px;margin:22px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
label.row{display:flex;gap:10px;align-items:center;padding:8px 0}
table{width:100%;border-collapse:collapse}
td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.k{text-align:right;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
button.key{min-width:92px;font-family:ui-monospace,Menlo,monospace}
button.key.rec{border-color:var(--accent);color:var(--accent)}
button.x{margin-left:4px;padding:4px 8px}
.note{color:var(--muted);font-size:12.5px;margin:6px 0}
.warn{color:var(--warn);font-size:12.5px;min-height:1.2em;margin-top:8px}
.bar{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<main>
  <h1>BiSub settings</h1>

  <h2>Display</h2>
  <label class="row"><input type="checkbox" id="pinyin"> Show pinyin above Chinese characters</label>

  <h2>Keyboard shortcuts</h2>
  <p class="note">Click a shortcut, then press the new key combination. Esc cancels, × disables it. Use a modifier (⌥ / Ctrl / ⇧ / ⌘) so the site's own shortcuts keep working.</p>
  <table><tbody id="list"></tbody></table>
  <div class="warn" id="warn"></div>
  <div class="bar"><button id="reset">Restore default shortcuts</button></div>
  <p class="note">Changes apply immediately to open video tabs.</p>
</main>
<script src="bisub-shortcuts.js"></script>
<script src="options.js"></script>
</body>
</html>
